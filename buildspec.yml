# AWS CodeBuild spec, run by the CodePipeline build stage on push to main.
#
# Builds the site, deploys the contact form's Lambda code, then publishes dist/
# to the S3 static-website bucket. There is no separate deploy stage: the upload
# happens here so hashed assets and index.html can get different Cache-Control
# headers.
version: 0.2

env:
  variables:
    BUCKET: abdulaziz-alsuhaibani-myportfolio-website
    # CloudFront distribution in front of the bucket. The CodeBuild role may
    # invalidate only this ID; while empty, the invalidation step is skipped.
    DISTRIBUTION_ID: E1C5938ABA94M6
    # Contact form function (infra/contact/). Only its code is deployed here;
    # its configuration is set in the console. The CodeBuild role may update
    # only this function.
    CONTACT_FUNCTION: abdulaziz-alsuhaibani-myportfolio-contact
  # The contact form's Lambda Function URL (see infra/contact/). Without it the
  # contact form reports "not configured". A listed parameter that does not
  # exist fails the build, so remove its line rather than leave it pointing at
  # nothing. VITE_CONTACT_ACCESS_KEY is not listed: the Lambda needs no key.
  parameter-store:
    VITE_CONTACT_ENDPOINT: /my-portfolio/VITE_CONTACT_ENDPOINT

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - npm run build
      # The function is plain ESM outside tsc's reach; at least refuse a syntax error.
      - node --check infra/contact/index.mjs
  post_build:
    commands:
      # post_build runs even after a failed build; never upload a broken dist/.
      - '[ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] || exit 1'
      # Function before site, so a new page never talks to an old function. If
      # this fails the phase stops here and the site is not uploaded either.
      # --query keeps the response, which echoes the function's environment
      # variables, out of the build log.
      - zip -X -j contact.zip infra/contact/index.mjs
      - aws lambda update-function-code --function-name "$CONTACT_FUNCTION" --zip-file fileb://contact.zip --query CodeSha256 --output text
      - aws lambda wait function-updated-v2 --function-name "$CONTACT_FUNCTION"
      # Hashed assets first, so the new index.html never references missing files.
      - aws s3 sync dist/assets "s3://$BUCKET/assets" --delete --cache-control "public,max-age=31536000,immutable"
      - aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" --cache-control "public,max-age=0,must-revalidate"
      - |
        if [ -n "$DISTRIBUTION_ID" ]; then
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
        fi
